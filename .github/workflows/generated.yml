name: Generated sources

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-14 libclang-14-dev
      - name: Run unit tests
        run: make test
      - name: Regenerate exact source closure
        env:
          CPYTHON_REPO_URL: https://github.com/python/cpython.git
          LIBCLANG: /usr/lib/llvm-14/lib/libclang.so.1
        run: make check-generated VERSION=3.12.8
