name: Build source set

on:
  workflow_call:
    inputs:
      generator_ref:
        description: Immutable frame-eval Git ref
        required: true
        type: string
      python_tag:
        description: Exact CPython release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      generator_ref:
        description: Immutable frame-eval Git ref
        required: true
        default: main
        type: string
      python_tag:
        description: Exact CPython release tag
        required: true
        default: v3.12.8
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out frame-eval
        uses: actions/checkout@v4
        with:
          repository: retracesoftware/frame-eval
          ref: ${{ inputs.generator_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-14 libclang-14-dev
      - name: Run unit tests
        run: make test
      - name: Generate and validate source set
        env:
          CPYTHON_REPO_URL: https://github.com/python/cpython.git
          LIBCLANG: /usr/lib/llvm-14/lib/libclang.so.1
          PYTHON_TAG: ${{ inputs.python_tag }}
        run: |
          if [[ ! "$PYTHON_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid exact CPython tag: $PYTHON_TAG" >&2
            exit 1
          fi
          make regenerate-frame-eval VERSION="${PYTHON_TAG#v}"
      - name: Test generated evaluator against CPython
        env:
          PYTHON_TAG: ${{ inputs.python_tag }}
        run: ./test-generated "${PYTHON_TAG#v}"
      - name: Package source set
        env:
          PYTHON_TAG: ${{ inputs.python_tag }}
        run: |
          version=${PYTHON_TAG#v}
          mkdir -p build/workflow
          tar -C build/workflow/sources -czf \
            "build/workflow/frame-eval-$version.tar.gz" "$version" \
            -C "$GITHUB_WORKSPACE" LICENSE
      - name: Upload source set
        uses: actions/upload-artifact@v4
        with:
          name: frame-eval-sources-${{ inputs.python_tag }}
          path: build/workflow/frame-eval-*.tar.gz
          if-no-files-found: error
          retention-days: 7
