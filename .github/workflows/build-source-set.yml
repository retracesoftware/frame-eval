name: Build source set

on:
  workflow_call:
    inputs:
      version:
        description: Exact CPython release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Exact CPython release
        required: true
        default: 3.12.8
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-14 libclang-14-dev
      - name: Run unit tests
        run: make test
      - name: Generate and validate source set
        env:
          CPYTHON_REPO_URL: https://github.com/python/cpython.git
          LIBCLANG: /usr/lib/llvm-14/lib/libclang.so.1
          VERSION: ${{ inputs.version }}
        run: make regenerate-frame-eval VERSION="$VERSION"
      - name: Package source set
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p build/workflow
          tar -C sources -czf "build/workflow/frame-eval-$VERSION.tar.gz" "$VERSION"
      - name: Upload source set
        uses: actions/upload-artifact@v4
        with:
          name: frame-eval-sources-${{ inputs.version }}
          path: build/workflow/frame-eval-${{ inputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7
