name: Update source sets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-source-sets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover supported versions
        id: versions
        run: |
          if [[ "$GITHUB_REF_TYPE" != branch ]]; then
            echo "source sets can only be committed to a branch" >&2
            exit 1
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          versions = sorted(path.stem for path in Path("patches").glob("*.patch"))
          if not versions:
              raise SystemExit("no release patches found")
          print(f"versions={json.dumps(versions)}")
          PY

  build:
    name: Build ${{ matrix.version }}
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.discover.outputs.versions) }}
    uses: ./.github/workflows/build-source-set.yml
    with:
      version: ${{ matrix.version }}

  commit:
    needs: [discover, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download source sets
        uses: actions/download-artifact@v4
        with:
          pattern: frame-eval-sources-*
          path: build/workflow/artifacts
      - name: Replace checked-in source sets
        env:
          EXPECTED_VERSIONS: ${{ needs.discover.outputs.versions }}
        run: |
          rm -rf sources
          mkdir -p sources
          while IFS= read -r -d '' archive; do
            tar -C sources -xzf "$archive"
          done < <(find build/workflow/artifacts -type f -name '*.tar.gz' -print0)
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = set(json.loads(os.environ["EXPECTED_VERSIONS"]))
          actual = {path.name for path in Path("sources").iterdir() if path.is_dir()}
          if actual != expected:
              raise SystemExit(
                  f"source set mismatch: expected {sorted(expected)}, got {sorted(actual)}"
              )
          missing = [
              version for version in expected
              if not (Path("sources") / version / ".generated").is_file()
          ]
          if missing:
              raise SystemExit(f"source sets missing provenance: {sorted(missing)}")
          PY
      - name: Commit source sets
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add -A -- sources
          if git diff --cached --quiet; then
            echo "all source sets are already current"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Regenerate frame eval source sets"
          git push origin "HEAD:$BRANCH"